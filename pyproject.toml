[project]
name = "evren-mcp"
version = "0.1.0"
description = "EVREN platformu için MCP sunucusu: Claude Code'dan maliyet onaylı model eğitimi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.scripts]
evren-mcp = "evren_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evren_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
