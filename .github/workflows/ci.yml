name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint ve tip denetimi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0 # v8 sonrasında kısa etiket (v10) yok; dependabot günceller
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q --cov --cov-report=term

  secrets:
    name: Sır taraması (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # bütün geçmiş: açık repoda eski commit'ler de görünür
          persist-credentials: false
      - name: gitleaks kur (sabit sürüm, sağlama toplamı doğrulanır)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tgz"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tgz\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tgz" gitleaks
      - run: ./gitleaks git --redact --no-banner -v

  build:
    name: Paket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv build
      - name: Paket içinde sır ya da yerel dosya yok
        run: |
          tar -tzf dist/*.tar.gz | tee sdist.txt
          ! grep -E '(^|/)\.env$|CLAUDE\.md|STATUS\.md|/docs/' sdist.txt

  # Branch kuralında "zorunlu kontrol" olarak tek bu iş seçilir; matris büyüse de
  # kural değişmez. Bir iş atlanır ya da iptal edilirse de kırmızı olur.
  sonuc:
    name: CI sonucu
    if: always()
    needs: [lint, test, secrets, build]
    runs-on: ubuntu-latest
    steps:
      - name: Bütün işler geçti mi
        env:
          SONUCLAR: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$SONUCLAR"
          for s in $SONUCLAR; do [ "$s" = success ] || exit 1; done
